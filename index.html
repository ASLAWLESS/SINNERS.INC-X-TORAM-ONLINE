<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINNERS.INS — Menú</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --black2: #111111;
    --black3: #1a1a1a;
    --gray-dark: #222222;
    --gray-mid: #333333;
    --gray: #555555;
    --gray-light: #888888;
    --white: #f0ede8;
    --white-dim: #b0ada8;
    --red: #cc1a1a;
    --red-dim: #8a1111;
    --red-bright: #e62020;
    --red-bg: rgba(204,26,26,0.1);
    --border: rgba(255,255,255,0.07);
    --border-red: rgba(204,26,26,0.3);
    --radius: 4px;
    --radius-lg: 6px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--black);
    color: var(--white);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  nav {
    background: var(--black2);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    height: 58px;
    display: flex; align-items: center; gap: 1rem;
    position: sticky; top: 0; z-index: 100;
  }
  .logo-wrap { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 34px; height: 34px;
    border-radius: var(--radius);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-icon img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .logo-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px; letter-spacing: 2px; color: var(--white); line-height: 1;
  }
  .logo-text span { color: var(--red); }

  main { max-width: 720px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }

  .page-header {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem;
    margin-bottom: 1.75rem; border-bottom: 1px solid var(--border); padding-bottom: 1.25rem;
  }
  .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: 3px; color: var(--white); line-height: 1; }
  .page-sub { font-size: 12px; color: var(--gray-light); margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }

  .card {
    background: var(--black2);
    border: 1px solid var(--border);
    border-top: 2px solid var(--red);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.5rem 1.5rem;
    margin-bottom: 1.25rem;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--black2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--red);
    border-radius: var(--radius-lg);
    padding: 1.1rem 1.3rem;
    text-decoration: none;
    color: var(--white);
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  .menu-item:hover {
    background: var(--black3);
    border-color: var(--border-red);
    transform: translateX(2px);
  }
  .menu-icon {
    width: 44px; height: 44px;
    background: var(--red-bg); border: 1px solid var(--border-red);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    color: var(--red-bright); font-size: 20px; flex-shrink: 0;
  }
  .menu-text { flex: 1; }
  .menu-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1.5px; color: var(--white);
  }
  .menu-desc { font-size: 12px; color: var(--gray-light); margin-top: 2px; }
  .menu-arrow { color: var(--gray-light); font-size: 16px; flex-shrink: 0; }
  .menu-item:hover .menu-arrow { color: var(--red-bright); }

  footer { text-align: center; color: var(--gray-light); font-size: 11px; margin-top: 1.5rem; }
  footer a { color: var(--red-bright); text-decoration: none; }

  @media (max-width: 640px) {
    main { padding: 1.25rem 1rem 2rem; }
  }
</style>
</head>
<body>
<nav>
  <div class="logo-wrap">
    <div class="logo-icon"><img src="image/logo.jpeg" alt="SINNERS.INS logo"></div>
    <div class="logo-text">SINNERS.<span>INS</span></div>
  </div>
</nav>

<main>
  <div class="page-header">
    <div>
      <div class="page-title">Menú Principal</div>
      <div class="page-sub">Herramientas — Toram Online</div>
    </div>
  </div>

  <div class="card">
    <div class="menu-grid">
      <a class="menu-item" href="xpcalculator.html">
        <div class="menu-icon"><i class="ti ti-calculator"></i></div>
        <div class="menu-text">
          <div class="menu-title">Calculadora de XP</div>
          <div class="menu-desc">Main Quest, niveles y costo en Spina</div>
        </div>
        <div class="menu-arrow"><i class="ti ti-chevron-right"></i></div>
      </a>
    </div>
  </div>

  <footer>
    <a href="https://toramtools.github.io" target="_blank" rel="noopener">Toram Tools</a> · SINNERS.INS
  </footer>
</main>

</body>
</html>
